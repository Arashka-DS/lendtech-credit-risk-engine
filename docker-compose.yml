services:
 # 1. The Business Data (LendTech Risk Engine)
  postgres_risk:
    image: postgres:15-alpine
    container_name: risk_db
    environment:
      POSTGRES_USER: risk_admin
      POSTGRES_PASSWORD: risk_password
      POSTGRES_DB: credit_risk_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_risk_data:/var/lib/postgresql/data

  # 2. Metabase Internal DB
  metabase_db:
    image: postgres:15
    container_name: metabase_internal_db
    environment:
      POSTGRES_USER: mb_user
      POSTGRES_PASSWORD: mb_password
      POSTGRES_DB: metabase_app
    # This database is purely internal.
    volumes:
      - metabase_pg_data:/var/lib/postgresql/data
      
  # 3. Metabase BI Tool
  metabase:
    image: metabase/metabase:latest
    container_name: metabase_risk
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase_app
      - MB_DB_PORT=5432
      - MB_DB_USER=mb_user
      - MB_DB_PASS=mb_password
      - MB_DB_HOST=metabase_db
    depends_on:
      - metabase_db
      - postgres_risk
      
 # 4. Our FastAPI
  risk_api:
    build: .
    container_name: risk_fastapi
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres_risk
      - DB_USER=risk_admin
      - DB_PASSWORD=risk_password
      - DB_NAME=credit_risk_db
    volumes:
      # Mounts local code to container for live-reloading
      - ./src:/app/src
      # Mounts models directory to persist the calibrated XGBoost .pkl file
      - ./models:/app/models
    # Executes the training script first, then boots the API
    command: >
      bash -c "python src/train_risk_model.py && 
               uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - postgres_risk

volumes:
  pg_risk_data:
  metabase_pg_data:
