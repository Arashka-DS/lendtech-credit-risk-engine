version: '3.8'

services:
  postgres_risk:
    image: postgres:15-alpine
    container_name: risk_db
    environment:
      POSTGRES_USER: risk_admin
      POSTGRES_PASSWORD: risk_password
      POSTGRES_DB: credit_risk_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_risk_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_risk
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=credit_risk_db
      - MB_DB_PORT=5432
      - MB_DB_USER=risk_admin
      - MB_DB_PASS=risk_password
      - MB_DB_HOST=postgres_risk
    depends_on:
      - postgres_risk

  risk_api:
    build: .
    container_name: risk_fastapi
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres_risk
      - DB_USER=risk_admin
      - DB_PASSWORD=risk_password
      - DB_NAME=credit_risk_db
    volumes:
      # Mounts local code to container for live-reloading
      - ./src:/app/src
      # Mounts models directory to persist the calibrated XGBoost .pkl file
      - ./models:/app/models
    # Executes the training script first, then boots the API
    command: >
      bash -c "python src/train_risk_model.py && 
               uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - postgres_risk

volumes:
  pg_risk_data:
